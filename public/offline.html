<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Hors-ligne — Conciergerie Hub</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, #ECFDF5 0%, #F8FAFC 60%);
      color: #0F172A;
      padding: 24px;
    }
    .card {
      background: #fff;
      border: 1px solid #E2E8F0;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, .06);
      padding: 40px 28px;
      max-width: 380px;
      width: 100%;
      text-align: center;
    }
    .emoji { font-size: 52px; }
    h1 { font-size: 20px; font-weight: 700; margin-top: 16px; }
    p { font-size: 14px; color: #64748B; line-height: 1.6; margin-top: 10px; }
    .hint { margin-top: 18px; font-size: 12px; color: #059669; font-weight: 600; }
    .brand { margin-top: 26px; font-size: 12px; color: #94A3B8; }
  </style>
</head>
<body>
  <main class="card">
    <div class="emoji" aria-hidden="true">📴</div>
    <h1>Vous êtes hors-ligne</h1>
    <p>Votre connexion internet est coupée. Les pages déjà consultées de cette app restent accessibles en cache.</p>
    <p class="hint">Reconnectez-vous au réseau (Wi-Fi du logement ou data) puis réessayez.</p>
    <div class="brand">Propulsé par 🗝️ <strong>Conciergerie Hub</strong></div>
  </main>
</body>
</html>
